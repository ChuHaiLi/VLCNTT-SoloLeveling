[platformio]
default_envs = wokwi
src_dir = firmware

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@2.8

[env:wokwi]
build_flags =
    -D TILT_WOKWI=1
    -D BUZZER_PASSIVE=1

[env:hardware]
; Copy firmware/secrets.example.h to firmware/secrets.h before building.
; Select the actual ESP32 board here before uploading.
build_flags =
    -D TILT_WOKWI=0

